<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>17-3 · 商品列表 - 张梓轩</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    min-height: 100vh;
    padding: 32px 20px;
  }
  .author { text-align: center; color: #667eea; margin-bottom: 6px; letter-spacing: 2px; }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.9rem; }
  .toolbar {
    max-width: 1100px;
    margin: 0 auto 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar .count {
    color: #555;
    font-size: 0.9rem;
  }
  .toolbar button {
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 9px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.15s;
  }
  .toolbar button:hover { transform: translateY(-1px); }

  .loading, .error-box, .empty {
    text-align: center;
    padding: 60px 20px;
    color: #764ba2;
    font-size: 1.1rem;
  }
  .error-box { color: #e74c3c; }

  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }

  .card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.15);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid rgba(102,126,234,0.08);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(102, 126, 234, 0.25);
  }
  .card .thumb {
    width: 100%;
    height: 180px;
    background: #f0f2f5;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .card:hover .thumb img { transform: scale(1.05); }

  .card .body { padding: 14px 16px 16px; }
  .card .category {
    font-size: 0.72rem;
    color: #764ba2;
    background: rgba(118, 75, 162, 0.1);
    padding: 3px 10px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 8px;
  }
  .card .title {
    font-size: 1rem;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .card .price {
    font-size: 1.2rem;
    color: #e74c3c;
    font-weight: bold;
  }
  .card .price small { font-size: 0.8rem; text-decoration: line-through; color: #999; margin-left: 6px; font-weight: normal; }
  .card .rating { font-size: 0.8rem; color: #f39c12; }
  .card .stock {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .card .stock.in { background: rgba(46,204,113,0.15); color: #27ae60; }
  .card .stock.low { background: rgba(230,126,34,0.15); color: #d35400; }
  .card .stock.out { background: rgba(231,76,60,0.15); color: #c0392b; }
  .card .view {
    margin-top: 10px;
    display: block;
    text-align: center;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: white;
    padding: 7px 0;
    border-radius: 6px;
    font-size: 0.88rem;
    text-decoration: none;
  }
  .card .view:hover { opacity: 0.92; }
</style>
</head>
<body>
  <div class="author">作者：张梓轩</div>
  <h1>商品列表</h1>
  <div class="subtitle">数据来源：dummyjson.com &nbsp;|&nbsp; 点击卡片查看详情</div>

  <div class="toolbar">
    <div class="count" id="count">正在加载...</div>
    <button onclick="loadList()">🔄 重新加载</button>
  </div>

  <div class="grid" id="grid"></div>

<script>
  var API = 'https://dummyjson.com/products?limit=8';

  function stockClass(s) {
    if (s === 'In Stock') return 'in';
    if (s === 'Low Stock') return 'low';
    return 'out';
  }

  function renderList(data) {
    var grid = document.getElementById('grid');
    var list = data.products || [];

    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">暂无数据 😢</div>';
      document.getElementById('count').textContent = '共 0 条';
      return;
    }

    document.getElementById('count').textContent = '共 ' + list.length + ' 条 · 总库存 ' + data.total + ' 件';

    grid.innerHTML = list.map(function(p) {
      var discountPrice = (p.price * (1 - p.discountPercentage / 100)).toFixed(2);
      var stockCss = stockClass(p.availabilityStatus);
      // 事件委托友好：每个卡片独立可点击
      return '<div class="card" data-id="' + p.id + '">' +
        '<div class="thumb"><img src="' + (p.thumbnail || p.images[0]) + '" alt="' + p.title + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<span style=&quot;color:#aaa;&quot;>无图</span>\'"></div>' +
        '<div class="body">' +
          '<span class="category">' + p.category + '</span>' +
          '<div class="title">' + p.title + '</div>' +
          '<div class="meta">' +
            '<span class="price">$' + discountPrice + '<small>$' + p.price + '</small></span>' +
            '<span class="rating">★ ' + p.rating + '</span>' +
          '</div>' +
          '<div class="stock ' + stockCss + '">' + p.availabilityStatus + '（' + p.stock + '）</div>' +
          '<a class="view" href="17-3-detail.html?id=' + p.id + '">查看详情 →</a>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function loadList() {
    var grid = document.getElementById('grid');
    document.getElementById('count').textContent = '⏳ 加载中...';
    grid.innerHTML = '<div class="loading" style="grid-column:1/-1;">⏳ 正在从 dummyjson.com 获取数据...</div>';

    fetch(API)
      .then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(renderList)
      .catch(function(err) {
        grid.innerHTML = '<div class="error-box" style="grid-column:1/-1;">❌ 加载失败：' + err.message + '<br>请检查网络或接口</div>';
        document.getElementById('count').textContent = '加载失败';
      });
  }

  // 事件委托：点击卡片跳转详情
  document.getElementById('grid').addEventListener('click', function(e) {
    var card = e.target.closest('.card');
    if (card) {
      var id = card.getAttribute('data-id');
      window.location.href = '17-3-detail.html?id=' + id;
    }
  });

  // 页面加载即请求
  loadList();
</script>
</body>
</html>
