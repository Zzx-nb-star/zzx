<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-4</title>
    <style>
        :root {
            font-size: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
        }

        body {
            padding: 1.5rem;
        }

        .title {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            color: #333;
        }

        .box-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .box {
            flex: 1 1 22%;
            min-width: 8rem;
            height: 8rem;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 900px) {
            .box {
                flex-basis: 31%;
            }
        }

        @media (max-width: 600px) {
            .box {
                flex-basis: 48%;
            }
        }

        @media (max-width: 400px) {
            .box {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="title">张梓轩</div>
    <div class="box-wrap">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
