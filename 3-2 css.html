<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>311 张梓轩</title>
    <style>
        /*1.h2黑底白字*/
        h2{
            background-color: black;
            color: white;
        }

        #box{
            width: 500px;
            height: 500px;
            background-color: rgb(191, 4, 248);
        }

        /*张梓轩三个字不同颜色*/
        .n1{
            color: red;
        }
        .n2{
            color: blue;
        }
        .n3{
            color: yellow;
        }

        /*4.学号盒子样式，自己可以改宽高背景色*/
        .stu-box{
            width: 320px;
            height: 110px;
            background-color: #87ceeb;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
       
        <h3>CSS<span style="color:white">选择器</span></h3>
        
        <p>
            <span class="n1">张</span>
            <span class="n2">梓</span>
            <span class="n3">轩</span>
        </p>
        <p>CSS属性</p>
    </div>

    
    <div class="stu-box">
        学号：24001010311
    </div>

</body>
</html>
