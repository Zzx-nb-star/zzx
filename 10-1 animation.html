<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f3f3;
        }

        .color-box {
            width: 220px;
            height: 220px;
            border-radius: 24px;
            background: #ff6b6b;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: colorChange 8s ease-in-out infinite;
        }

        @keyframes colorChange {
            0% {
                background: #ff6b6b;
            }
            25% {
                background: #feca57;
            }
            50% {
                background: #48dbfb;
            }
            75% {
                background: #1dd1a1;
            }
            100% {
                background: #ff6b6b;
            }
        }
    </style>
</head>
<body>
    <div class="color-box"></div>
</body>
</html>
