<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数7游戏 - 张梓轩</title>
<style>
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 20px;
  }
  h1 {
    color: #333;
  }
  .author {
    color: #e74c3c;
    font-size: 20px;
    margin-bottom: 20px;
    font-weight: bold;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 46px);
    gap: 4px;
    width: 496px;
    margin: 0 auto;
  }
  .box {
    width: 46px;
    height: 46px;
    border: 2px solid #3498db;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    background: #fff;
    color: #3498db;
    box-sizing: border-box;
  }
  .box.empty {
    background: #e74c3c;
    border-color: #c0392b;
    color: transparent;
  }
</style>
</head>
<body>
  <h1>数7游戏</h1>
  <div class="author">作者：张梓轩</div>
  <div class="grid" id="grid"></div>

<script>
  var grid = document.getElementById('grid');
  var html = '';
  for (var i = 1; i <= 100; i++) {
    var isEmpty = (i % 7 === 0) || (i % 10 === 7);
    var cls = 'box' + (isEmpty ? ' empty' : '');
    html += '<div class="' + cls + '">' + (isEmpty ? '' : i) + '</div>';
  }
  grid.innerHTML = html;
</script>
</body>
</html>
