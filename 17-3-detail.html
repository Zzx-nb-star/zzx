<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>17-3 · 商品详情 - 张梓轩</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    min-height: 100vh;
    padding: 32px 20px;
  }
  .author { text-align: center; color: #667eea; margin-bottom: 6px; letter-spacing: 2px; }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .back {
    display: inline-block;
    text-align: center;
    margin: 0 auto 20px;
    text-decoration: none;
    color: #667eea;
    font-size: 0.9rem;
    border: 1px solid #667eea;
    padding: 6px 18px;
    border-radius: 999px;
    transition: all 0.2s;
  }
  .back:hover { background: #667eea; color: white; }

  .loading, .error-box {
    text-align: center;
    padding: 80px 20px;
    font-size: 1.1rem;
    color: #764ba2;
  }
  .error-box { color: #e74c3c; }

  .detail {
    max-width: 1000px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(102,126,234,0.15);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .gallery {
    padding: 28px;
    background: #fafbff;
  }
  .gallery .main-img {
    width: 100%;
    height: 360px;
    background: white;
    border-radius: 12px;
    border: 1px solid rgba(102,126,234,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .gallery .main-img img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .gallery .thumbs {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    overflow-x: auto;
  }
  .gallery .thumbs img {
    width: 60px; height: 60px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .gallery .thumbs img.active { border-color: #667eea; }

  .info { padding: 28px 30px; }
  .info .cat {
    font-size: 0.75rem;
    color: #764ba2;
    background: rgba(118,75,162,0.1);
    padding: 4px 12px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 10px;
  }
  .info .title {
    font-size: 1.5rem;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 6px;
  }
  .info .brand { color: #7f8c8d; font-size: 0.88rem; margin-bottom: 16px; }
  .info .brand b { color: #2c3e50; }
  .info .price-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    padding: 14px;
    background: linear-gradient(135deg, #fff5f5, #ffeaea);
    border-radius: 10px;
  }
  .info .price { font-size: 1.9rem; color: #e74c3c; font-weight: bold; }
  .info .price-old { font-size: 1rem; color: #95a5a6; text-decoration: line-through; }
  .info .discount {
    background: #e74c3c; color: white;
    padding: 3px 10px; border-radius: 6px; font-size: 0.8rem;
  }
  .info .rating-row {
    display: flex; gap: 18px; margin-bottom: 16px;
    font-size: 0.9rem; color: #555;
  }
  .info .rating-row .star { color: #f39c12; font-weight: bold; }
  .info .desc {
    font-size: 0.9rem;
    line-height: 1.8;
    color: #555;
    margin-bottom: 18px;
    padding: 14px;
    background: #fafbff;
    border-radius: 10px;
    border-left: 3px solid #667eea;
  }

  .kv {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 18px;
    font-size: 0.85rem;
    margin-bottom: 18px;
  }
  .kv dt { color: #764ba2; }
  .kv dd { color: #34495e; word-break: break-all; }

  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .actions .buy {
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: white;
  }
  .actions .cart {
    background: white;
    color: #667eea;
    border: 1.5px solid #667eea;
  }
  .actions button:hover { transform: translateY(-1px); }

  .reviews { margin-top: 24px; max-width: 1000px; margin-left: auto; margin-right: auto; }
  .reviews h3 {
    color: #764ba2; font-size: 1.1rem; margin-bottom: 14px;
    padding-bottom: 8px; border-bottom: 2px solid #eee;
  }
  .review-item {
    background: white;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  }
  .review-item .rhead {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .review-item .rname { font-weight: bold; color: #2c3e50; }
  .review-item .rrate { color: #f39c12; font-size: 0.85rem; }
  .review-item .rdate { color: #95a5a6; font-size: 0.78rem; }
  .review-item .rmsg { color: #555; font-size: 0.9rem; line-height: 1.6; }

  @media (max-width: 720px) {
    .detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="author">作者：张梓轩</div>
  <h1>商品详情</h1>
  <div style="text-align:center;"><a class="back" href="17-3.html">← 返回列表</a></div>

  <div id="stage"></div>

<script>
  // 从 URL 读取 ?id=
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var stage = document.getElementById('stage');

  function stockText(s) {
    return s;
  }

  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  function loadDetail(productId) {
    stage.innerHTML = '<div class="loading">⏳ 正在加载 id=' + productId + ' 的商品...</div>';

    fetch('https://dummyjson.com/products/' + productId)
      .then(function(response) {
        if (!response.ok) {
          if (response.status === 404) throw new Error('商品 id=' + productId + ' 不存在（404）');
          throw new Error('HTTP ' + response.status);
        }
        return response.json();
      })
      .then(renderDetail)
      .catch(function(err) {
        stage.innerHTML = '<div class="error-box">❌ 加载失败：' + err.message + '<br><a class="back" href="17-3.html" style="margin-top:10px;">返回列表</a></div>';
      });
  }

  function renderDetail(p) {
    var discountPrice = (p.price * (1 - p.discountPercentage / 100)).toFixed(2);
    var images = p.images && p.images.length ? p.images : [p.thumbnail];

    // 主图 + 缩略图
    var thumbs = images.map(function(img, i) {
      return '<img src="' + img + '" class="' + (i===0?'active':'') + '" data-full="' + img + '" loading="lazy" onerror="this.style.display=\'none\'">';
    }).join('');

    // 规格字段
    var dims = p.dimensions ? (p.dimensions.width + ' × ' + p.dimensions.height + ' × ' + p.dimensions.depth) : '—';
    var tagsHtml = (p.tags || []).map(function(t) { return '<span style="background:#667eea;color:white;padding:2px 10px;border-radius:999px;font-size:0.75rem;margin-right:6px;">' + t + '</span>'; }).join('');

    // 商品主体
    stage.innerHTML =
      '<div class="detail">' +
        '<div class="gallery">' +
          '<div class="main-img"><img id="mainImg" src="' + images[0] + '" alt="' + p.title + '" onerror="this.parentElement.innerHTML=\'<span style=&quot;color:#aaa;&quot;>无图</span>\'"></div>' +
          '<div class="thumbs">' + thumbs + '</div>' +
        '</div>' +
        '<div class="info">' +
          '<span class="cat">' + p.category + '</span>' +
          '<div class="title">' + p.title + '</div>' +
          '<div class="brand">品牌：<b>' + (p.brand || '—') + '</b> &nbsp;|&nbsp; SKU：' + p.sku + '</div>' +
          '<div class="price-row">' +
            '<span class="price">$' + discountPrice + '</span>' +
            '<span class="price-old">$' + p.price + '</span>' +
            '<span class="discount">-' + p.discountPercentage + '%</span>' +
          '</div>' +
          '<div class="rating-row">' +
            '<span class="star">★ ' + p.rating + '</span>' +
            '<span>库存：' + p.stock + '（' + p.availabilityStatus + '）</span>' +
            '<span>MOQ：' + p.minimumOrderQuantity + '</span>' +
          '</div>' +
          '<div class="desc">' + p.description + '</div>' +
          '<dl class="kv">' +
            '<dt>重量</dt><dd>' + p.weight + ' g</dd>' +
            '<dt>尺寸</dt><dd>' + dims + ' cm</dd>' +
            '<dt>保修</dt><dd>' + p.warrantyInformation + '</dd>' +
            '<dt>配送</dt><dd>' + p.shippingInformation + '</dd>' +
            '<dt>退换</dt><dd>' + p.returnPolicy + '</dd>' +
            '<dt>标签</dt><dd>' + tagsHtml + '</dd>' +
          '</dl>' +
          '<div class="actions">' +
            '<button class="cart">🛒 加入购物车</button>' +
            '<button class="buy">立即购买</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    // 缩略图切换
    document.querySelectorAll('.thumbs img').forEach(function(t) {
      t.addEventListener('click', function() {
        document.querySelectorAll('.thumbs img').forEach(function(x){ x.classList.remove('active'); });
        t.classList.add('active');
        document.getElementById('mainImg').src = t.getAttribute('data-full');
      });
    });

    // 评价区
    if (p.reviews && p.reviews.length) {
      var reviewHtml = p.reviews.map(function(r) {
        var stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        return '<div class="review-item">' +
          '<div class="rhead">' +
            '<span class="rname">' + r.reviewerName + ' <span style="color:#aaa;font-weight:normal;font-size:0.8rem;">(' + r.reviewerEmail + ')</span></span>' +
            '<span class="rdate">' + formatDate(r.date) + '</span>' +
          '</div>' +
          '<div class="rrate">' + stars + '  ' + r.rating + '/5</div>' +
          '<div class="rmsg">' + r.comment + '</div>' +
        '</div>';
      }).join('');

      var wrap = document.createElement('div');
      wrap.className = 'reviews';
      wrap.innerHTML = '<h3>用户评价（' + p.reviews.length + ' 条）</h3>' + reviewHtml;
      stage.parentNode.insertBefore(wrap, stage.nextSibling);
    }
  }

  if (!id) {
    stage.innerHTML = '<div class="error-box">❌ 缺少商品 ID！<br>请通过列表页点击卡片进入，例如：17-3-detail.html?id=1<br><a class="back" href="17-3.html" style="margin-top:10px;">返回列表</a></div>';
  } else {
    loadDetail(id);
  }
</script>
</body>
</html>
