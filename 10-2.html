<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .slider {
            position: relative;
            width: 760px;
            height: 500px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 36px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            animation: slideMove 9s ease-in-out infinite;
            z-index: 1;
        }

        .slide img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            background: #000;
            filter: brightness(0.95);
            z-index: 1;
        }

        .caption {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            color: #fff;
            font-size: 22px;
            letter-spacing: 2px;
            padding: 10px 26px;
            border-radius: 999px;
            white-space: nowrap;
            z-index: 3;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .slide:nth-child(1) { animation-delay: 0s; }
        .slide:nth-child(2) { animation-delay: 3s; }
        .slide:nth-child(3) { animation-delay: 6s; }

        @keyframes slideMove {
            0% {
                transform: translateX(0);
                opacity: 1;
                z-index: 2;
            }
            25% {
                transform: translateX(-10%);
                opacity: 1;
                z-index: 2;
            }
            33% {
                transform: translateX(-100%);
                opacity: 0;
                z-index: 1;
            }
            100% {
                transform: translateX(-100%);
                opacity: 0;
                z-index: 1;
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slide">
            <img src="img/a1.jpg" alt="图片1">
            <div class="caption">张梓轩</div>
        </div>
        <div class="slide">
            <img src="img/a2.jpg" alt="图片2">
            <div class="caption">张梓轩</div>
        </div>
        <div class="slide">
            <img src="img/a3.png" alt="图片3">
            <div class="caption">张梓轩</div>
        </div>
    </div>
</body>
</html>
